<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 인생 타임머신</title>
    <style>
        body {
            background-color: #fdf6e3;
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            padding: 40px 20px;
            color: #5d4037;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        h1 { font-family: 'Georgia', serif; margin-bottom: 30px; }
        
        #year-buttons { margin-bottom: 40px; }
        
        button {
            margin: 5px;
            padding: 12px 20px;
            background-color: #dcb085;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }
        button:hover { background-color: #bf8f63; transform: scale(1.05); }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 1px solid #efeae0;
            animation: fadeIn 0.5s ease-in-out;
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>나의 인생 타임머신</h1>
        <div id="year-buttons"></div>
        <div id="card-display">
            <p style="margin-top: 50px;">연도 버튼을 눌러 소중한 추억을 꺼내보세요.</p>
        </div>
    </div>

    <script>
        // 업로드해주신 이미지 파일(2022.jpg, 2023.jpg, 2026.jpg)을 반영했습니다.
        const data = [
            { year: 2022, title: "하나개 해수욕장", story: "신랑과 함께", emotion: "행복", photo: "2022.jpg", quote: "행복은 특별한 곳에 있는 것이 아니라, 사랑하는 사람과 함께하는 순간에 있다" },
            { year: 2023, title: "강릉 카페", story: "신랑과 함께", emotion: "즐거움", photo: "2023.jpg", quote: "좋은 사람과의 시간은 평범한 하루도 여행으로 만든다" },
            { year: 2026, title: "춘천 추모공원", story: "신랑과 함께", emotion: "고마움", photo: "2026.jpg", quote: "감사는 지나온 시간을 아름답게 기억하게 하는 마음의 선물이다" }
        ];

        const buttonContainer = document.getElementById('year-buttons');
        const cardDisplay = document.getElementById('card-display');

        data.forEach(item => {
            const btn = document.createElement('button');
            btn.innerText = item.year;
            btn.onclick = () => showCard(item);
            buttonContainer.appendChild(btn);
        });

        function showCard(item) {
            cardDisplay.innerHTML = `
                <div class="card">
                    <h2>${item.year}년 - ${item.title}</h2>
                    <img src="${item.photo}" alt="${item.title}">
                    <p><strong>이야기:</strong> ${item.story}</p>
                    <p><strong>감정:</strong> ${item.emotion}</p>
                    <p style="font-style: italic; color: #8d6e63; margin-top: 20px;">"${item.quote}"</p>
                </div>
            `;
        }
    </script>
</body>
</html>
