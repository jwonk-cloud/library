<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 여행 기록: 따뜻한 추억 앨범</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap');
        body { font-family: 'Gaegu', cursive; background-color: #fdfaf6; color: #5d4037; }
        .album-card { transition: all 0.4s ease; }
        .album-card.active { opacity: 1; transform: translateY(0); }
        .fade-in { opacity: 0; transform: translateY(10px); }
    </style>
</head>
<body class="p-6 md:p-12">
    <header class="text-center mb-12">
        <h1 class="text-5xl font-bold mb-3 text-[#8d6e63]">나의 여행 기록 📔</h1>
        <p class="text-xl opacity-80">소중한 순간들을 담아보았습니다.</p>
    </header>
    
    <main class="max-w-5xl mx-auto flex flex-col md:flex-row gap-8">
        <div id="btn-container" class="grid grid-cols-2 md:grid-cols-1 gap-3 md:w-1/3 content-start"></div>
        
        <div id="display-container" class="md:w-2/3">
            <div id="card" class="hidden fade-in bg-white p-6 rounded-3xl shadow-xl border-4 border-[#efebe9]">
                <img id="card-img" src="" alt="여행 사진" class="w-full h-72 object-cover rounded-2xl mb-6 bg-[#efebe9]">
                <h2 id="card-title" class="text-3xl font-bold mb-3 text-[#5d4037]"></h2>
                <p id="card-text" class="text-xl leading-relaxed text-gray-700"></p>
            </div>
            <div id="placeholder" class="h-full flex items-center justify-center p-10 border-4 border-dashed border-[#d7ccc8] rounded-3xl text-gray-400">
                <p>버튼을 눌러 여행의 조각들을 확인해보세요.</p>
            </div>
        </div>
    </main>

    <script>
        const travelData = [
            {순서: "첫 번째", 제목: "그림책 정원", 이야기: "그림책 정원 1937은 옛 충북 도청 본관을 그림책 중심 복합 문화공간으로 탈바꿈한 곳입니다.", 사진파일명: "입구.jpg"},
            {순서: "두 번째", 제목: "메모", 이야기: "전시된 그림책을 읽고 감상평을 남겨둔 소중한 메모들이 가득합니다.", 사진파일명: "메모.jpg"},
            {순서: "세 번째", 제목: "휴식공간1", 이야기: "옛 건물의 시간의 흔적이 고스란히 남아 있는 평온한 공간입니다.", 사진파일명: "휴식1.jpg"},
            {순서: "네 번째", 제목: "팝업북", 이야기: "엘레나 셀레나 팝업북전에서 만난 경이로운 종이 세계입니다.", 사진파일명: "팝업북.jpg"},
            {순서: "다섯 번째", 제목: "휴식공간2", 이야기: "따뜻한 조명이 공간을 아늑하게 채워주어 머물기 좋습니다.", 사진파일명: "휴식2.jpg"},
            {순서: "여섯 번째", 제목: "그림책 원화전", 이야기: "정승각 작가님의 따뜻한 온기가 느껴지는 원화전이었습니다.", 사진파일명: "원화.jpg"},
            {순서: "일곱 번째", 제목: "서가", 이야기: "작가별로 정성스럽게 분류된 서가 배가가 무척 인상적입니다.", 사진파일명: "서가.jpg"},
            {순서: "여덟 번째", 제목: "메밀국수", 이야기: "오래된 청주의 맛집에서 즐긴 정겨운 메밀국수의 맛입니다.", 사진파일명: "국수.jpg"}
        ];

        const btnContainer = document.getElementById('btn-container');
        const cardDisplay = document.getElementById('card');
        const placeholder = document.getElementById('placeholder');
        const cardImg = document.getElementById('card-img');
        const cardTitle = document.getElementById('card-title');
        const cardText = document.getElementById('card-text');

        travelData.forEach(item => {
            const btn = document.createElement('button');
            btn.innerText = item.순서;
            btn.className = "bg-[#d7ccc8] hover:bg-[#8d6e63] text-white px-5 py-4 rounded-xl font-bold shadow-md transition-all transform hover:scale-105 active:scale-95";
            btn.onclick = () => showCard(item);
            btnContainer.appendChild(btn);
        });

        function showCard(item) {
            placeholder.classList.add('hidden');
            cardDisplay.classList.remove('hidden', 'fade-in');
            
            // 이미지 설정
            cardImg.src = item.사진파일명;
            cardImg.onerror = () => {
                cardImg.src = `https://placehold.co/800x400/efebe9/8d6e63?text=${encodeURIComponent(item.제목)}`;
            };
            
            cardTitle.innerText = item.제목;
            cardText.innerText = item.이야기;
            
            // 애니메이션 클래스 재적용
            void cardDisplay.offsetWidth; 
            cardDisplay.classList.add('active');
        }
    </script>
</body>
</html>
