<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 여행 기록: 따뜻한 추억 앨범</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap');
        body { font-family: 'Gaegu', cursive; background-color: #fdfaf6; color: #5d4037; }
        .album-card { transition: transform 0.3s ease; }
        .album-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="text-center mb-10">
        <h1 class="text-4xl font-bold mb-2 text-[#8d6e63]">나의 여행 기록 📔</h1>
        <p class="text-lg opacity-80">소중한 순간들을 차곡차곡 담아보았습니다.</p>
    </header>

    <main class="max-w-4xl mx-auto">
        <!-- 순서 버튼 섹션 -->
        <div id="btn-container" class="flex flex-wrap justify-center gap-3 mb-10"></div>

        <!-- 이야기 카드 섹션 -->
        <div id="display-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div id="card" class="hidden bg-white p-6 rounded-3xl shadow-lg border-4 border-[#efebe9] album-card">
                <img id="card-img" src="" alt="여행 사진" class="w-full h-64 object-cover rounded-2xl mb-4 bg-gray-200">
                <h2 id="card-title" class="text-2xl font-bold mb-2"></h2>
                <p id="card-text" class="text-lg leading-relaxed"></p>
            </div>
        </div>
    </main>

    <script>
        // 사진 파일 이름을 아래에 맞게 수정하세요.
        // 예를 들어 바탕화면의 사진 이름을 '입구.jpg'로 변경하고 폴더에 넣었다면 아래를 그대로 두시면 됩니다.
        const travelData = [
            {순서: "첫 번째", 제목: "그림책 정원", 이야기: "그림책 정원 1937은 옛 충북 도청 본관을 그림책 중심 복합 문화공간으로 탈바꿈", 사진파일명: "입구.jpg"},
            {순서: "두 번째", 제목: "메모", 이야기: "전시된 그림책을 읽고 감상평을 남겨둔 메모들", 사진파일명: "메모.jpg"},
            {순서: "세 번쨰", 제목: "휴식공간1", 이야기: "옛 건물의 흔적이 고스란히 남아 있는 공간", 사진파일명: "휴식1.jpg"},
            {순서: "네 번째", 제목: "팝업북", 이야기: "팝업북의 경이로움 (엘레나 셀레나 팝업북전)", 사진파일명: "팝업북.jpg"},
            {순서: "다섯 번재", 제목: "휴식공간2", 이야기: "조명이 인상적인 공간", 사진파일명: "휴식2.jpg"},
            {순서: "여섯 번쨰", 제목: "그림책 원화전", 이야기: "정승각 작가님의 원화전", 사진파일명: "원화.jpg"},
            {순서: "일곱 번째", 제목: "서가", 이야기: "작가별 그림책 배가가 인상적", 사진파일명: "서가.jpg"},
            {순서: "여덟 번쨰", 제목: "메밀국수", 이야기: "메밀 국수만 파는 오래된 청주의 맛집", 사진파일명: "국수.jpg"}
        ];

        const btnContainer = document.getElementById('btn-container');
        const cardDisplay = document.getElementById('card');
        const cardImg = document.getElementById('card-img');
        const cardTitle = document.getElementById('card-title');
        const cardText = document.getElementById('card-text');

        // 버튼 생성
        travelData.forEach(item => {
            const btn = document.createElement('button');
            btn.innerText = item.순서;
            btn.className = "bg-[#d7ccc8] hover:bg-[#8d6e63] text-white px-6 py-2 rounded-full font-bold shadow-md transition";
            btn.onclick = () => showCard(item);
            btnContainer.appendChild(btn);
        });

        function showCard(item) {
            // 파일을 찾지 못할 경우 제목이 적힌 플레이스홀더 이미지를 보여줍니다.
            cardImg.src = item.사진파일명;
            cardImg.onerror = () => {
                cardImg.src = `https://placehold.co/600x400/e0e0e0/5d4037?text=${encodeURIComponent(item.제목)}`;
            };
            cardTitle.innerText = item.제목;
            cardText.innerText = item.이야기;
            cardDisplay.classList.remove('hidden');
        }
    </script>
</body>
</html>
