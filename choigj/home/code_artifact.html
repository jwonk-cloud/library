<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 인생 타임머신</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 2rem 1rem; }
        header { text-align: center; margin-bottom: 3rem; }
        .timeline { display: flex; gap: 1rem; margin-bottom: 3rem; flex-wrap: wrap; justify-content: center; }
        .year-btn { background-color: var(--card-bg); padding: 0.75rem 1.5rem; border-radius: 9999px; font-weight: 600; cursor: pointer; border: 2px solid transparent; transition: all 0.3s; }
        .year-btn.active { background-color: var(--primary-color); color: white; }
        main { width: 100%; max-width: 600px; }
        .card { background-color: var(--card-bg); border-radius: 1.5rem; padding: 2rem; box-shadow: var(--shadow-lg); display: none; flex-direction: column; gap: 1.5rem; }
        .card.active { display: flex; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .photo-area { width: 100%; height: 250px; background-color: #e2e8f0; border-radius: 1rem; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        .photo-img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <header>
        <h1>⏳ 나의 인생 타임머신</h1>
        <p>연도를 클릭하여 추억을 되돌아보세요.</p>
    </header>
    <nav class="timeline" id="timeline"></nav>
    <main id="card-container"></main>

    <script>
        const timelineData = [
            { year: '2003', title: '첫 만남', story: '건강하게 태어남!!', emotion: '설렘', emoji: '😊', quote: '첫 만남이 설레었다.', imageUrl: 'https://images.unsplash.com/photo-1519689680058-324335c77eba?auto=format&fit=crop&w=600&q=80' },
            { year: '2010', title: '첫 가족여행', story: '가족과 제주도 여행', emotion: '행복', emoji: '❤️', quote: '가족여행의 즐거움을 즐겼다.', imageUrl: 'https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=600&q=80' },
            { year: '2022', title: '대학생이 됨', story: '새로운 꿈을 찾기 시작했다.', emotion: '기대', emoji: '😄', quote: '새로운 도전을 시작했다.', imageUrl: 'https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=600&q=80' },
            { year: '2026', title: '현재', story: '미래를 준비하고 있다.', emotion: '긴장', emoji: '😅', quote: '미래를 위한 준비과정을 하고 있다.', imageUrl: 'https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=600&q=80' }
        ];

        function initApp() {
            timelineData.forEach((data, index) => {
                const btn = document.createElement('button');
                btn.className = 'year-btn';
                btn.innerText = data.year;
                btn.onclick = () => selectYear(index);
                document.getElementById('timeline').appendChild(btn);

                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${index}`;
                card.innerHTML = `
                    <h3>${data.year} - ${data.title}</h3>
                    <div class="photo-area">
                        <img src="${data.imageUrl}" class="photo-img" alt="${data.title}" 
                             onerror="this.onerror=null; this.src='https://placehold.co/600x250?text=Image+Unavailable';">
                    </div>
                    <p>${data.story}</p>
                    <p><strong>감정:</strong> ${data.emotion} ${data.emoji}</p>
                    <p><em>"${data.quote}"</em></p>
                `;
                document.getElementById('card-container').appendChild(card);
            });
            selectYear(0);
        }

        function selectYear(index) {
            document.querySelectorAll('.year-btn').forEach((b, i) => b.classList.toggle('active', i === index));
            document.querySelectorAll('.card').forEach((c, i) => c.classList.toggle('active', i === index));
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
